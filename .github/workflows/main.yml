name: Attendance Bot
on:
  schedule:
    # Runs at 10:20 AM CST (15:20 UTC) every Monday and Wednesday
    - cron: '20 15 * * 1,3'
  workflow_dispatch: # Enables the manual "Run workflow" button for testing

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium # Installs required system libraries for Linux

      - name: Run Script
        env:
          # Injects your JSON cookies from Repository Secrets into the environment
          GOOGLE_COOKIES: ${{ secrets.GOOGLE_COOKIES }} 
        run: python bot.py

      - name: Upload Debug Screenshots
        if: always() # Ensures screenshots upload even if the script crashes
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: "*.png" # Captures error.png or failed_submit.png
